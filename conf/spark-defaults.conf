# ─────────────────────────────────────────────────────────────────────────────
# spark-defaults.conf -- Configuration Spark pour ClimaCity Paris
#
# Ce fichier est chargé automatiquement par Spark à chaque création de session.
# Les valeurs peuvent être surchargées dans le code Python avec
# SparkSession.builder.config("clé", "valeur").
# ─────────────────────────────────────────────────────────────────────────────

# ── Delta Lake ────────────────────────────────────────────────────────────────
# Active les extensions SQL de Delta Lake (DESCRIBE HISTORY, TIME TRAVEL…)
spark.sql.extensions                    io.delta.sql.DeltaSparkSessionExtension
# Remplace le catalogue Spark par le catalogue Delta (nécessaire pour MERGE INTO)
spark.sql.catalog.spark_catalog         org.apache.spark.sql.delta.catalog.DeltaCatalog

# ── Mémoire (mode local, machine étudiante) ───────────────────────────────────
# En mode local, le driver EST l'executor : toute la mémoire va au driver.
# 4g est adapté à une machine avec 8 Go de RAM.
# Augmentez à 6g si vous avez 16 Go et traitez de gros volumes.
spark.driver.memory                     4g
spark.driver.maxResultSize              2g

# ── Parallelisme ──────────────────────────────────────────────────────────────
# Nombre de partitions après un shuffle (GROUP BY, JOIN…).
# 8 est adapté à un laptop avec 4-8 coeurs en mode local.
# Augmentez à 16 si vos calculs génèrent beaucoup de partitions vides.
spark.sql.shuffle.partitions            8

# Seuil en dessous duquel Spark effectue une broadcast join automatiquement.
# 50 MB est une valeur conservative -- augmentez à 100m si la table météo
# est chargée en mémoire sans problème.
spark.sql.autoBroadcastJoinThreshold    52428800

# ── Interface utilisateur ─────────────────────────────────────────────────────
# Désactive les barres de progression dans les notebooks (plus lisible)
spark.ui.showConsoleProgress            false
# Port du Spark UI (accessible sur http://localhost:4040 hors Docker,
# ou http://localhost:${SPARK_UI_PORT} selon le docker-compose)
spark.ui.port                           4040

# ── Optimisations ─────────────────────────────────────────────────────────────
# Active la génération de code JVM optimisé (Tungsten whole-stage codegen)
spark.sql.codegen.wholeStage            true
# Collecte de statistiques sur les colonnes après écriture
# (améliore le predicate pushdown sur Parquet/Delta)
spark.sql.statistics.size.autoUpdate.enabled  true

# ── Logging ───────────────────────────────────────────────────────────────────
# Réduit la verbosité des logs Spark dans les notebooks.
# Changez en INFO pour voir plus de détails pendant le débogage.
# La valeur est surchargée dans chaque notebook avec sc.setLogLevel("WARN").
spark.log.level                         WARN
